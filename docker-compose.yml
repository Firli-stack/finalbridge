services:
  # -------------------------------------------------------------
  # 1. MQTT Broker (Eclipse Mosquitto) untuk IoT Telemetry
  # -------------------------------------------------------------
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: bridgecom-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    # Mengizinkan koneksi tanpa autentikasi untuk pengujian lokal/TA
    command: mosquitto -c /mosquitto-no-auth.conf
    networks:
      - bridgecom-network

  # -------------------------------------------------------------
  # 2. Backend (FastAPI + AI Engine + IoT Bridge)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bridgecom-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CAMERA_SOURCE=0 # Ganti dengan index kamera, IP Cam URL, atau nama file video
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - MQTT_TOPIC_GESTURE=bridgecom/gesture/detected
      - MQTT_TOPIC_STATUS=bridgecom/device/status
      - MQTT_TOPIC_SENSOR=bridgecom/sensor/trigger
    volumes:
      - backend_data:/app/uploads
      - backend_db:/app
    depends_on:
      - mqtt-broker
    networks:
      - bridgecom-network

  # -------------------------------------------------------------
  # 3. Frontend (React + Vite + Tailwind via Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: bridgecom-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bridgecom-network

networks:
  bridgecom-network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  backend_data:
  backend_db:
