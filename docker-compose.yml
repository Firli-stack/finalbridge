services:
  # -------------------------------------------------------------
  # 1. MQTT Broker (Eclipse Mosquitto) untuk IoT Telemetry
  # -------------------------------------------------------------
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: bridgecom-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    command: mosquitto -c /mosquitto-no-auth.conf
    networks:
      - bridgecom-network

  # -------------------------------------------------------------
  # 2. Backend (FastAPI + AI Engine + Hot Reload)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bridgecom-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CAMERA_SOURCE=0
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - MQTT_TOPIC_GESTURE=bridgecom/gesture/detected
      - MQTT_TOPIC_STATUS=bridgecom/device/status
      - MQTT_TOPIC_SENSOR=bridgecom/sensor/trigger
    volumes:
      - ./Backend:/app # Live-Sync kode backend (Auto-Reload Python)
      - backend_data:/app/uploads
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - mqtt-broker
    networks:
      - bridgecom-network

  # -------------------------------------------------------------
  # 3. Frontend (React + Vite Hot Reload)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: bridgecom-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
      - "80:5173" # Bisa diakses di port 80 dan port 5173
    volumes:
      - ./Frontend:/app # Live-Sync kode frontend (Hot-Module-Replacement)
      - /app/node_modules # Lindungi node_modules container dari overwrite
    depends_on:
      - backend
    networks:
      - bridgecom-network

networks:
  bridgecom-network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  backend_data:
